name: Build Universal Switch App

on:
  workflow_dispatch:
    inputs:
      method_selector:
        description: 'Choose your download method'
        required: true
        default: 'ddl'
        type: choice
        options:
          - ddl
          - gdrive
      game_source_input:
        description: 'Paste your URL link OR Google Drive File ID'
        required: true
        type: string
      artifact_name:
        description: 'Name of the output app (e.g., Mario-Wonder)'
        required: true
        default: 'Switch-Game-App'
        type: string
      build_target:
        description: 'Choose your target platform'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - macos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install macOS Dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang p7zip
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET Runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'" pycryptodome zstandard

      - name: Setup Workspace Directories
        run: |
          mkdir -p game_input
          mkdir -p keys_input

      - name: Deploy Raw Keys
        run: |
          cat << 'EOF' > keys_input/prod.keys
          ${{ secrets.BASE64_KEYS }}
          EOF
          sed -i '' 's/\r$//' keys_input/prod.keys

      - name: Fetch and Process Game Data
        run: |
          cat << 'EOF' > process_game.py
          import sys, os, urllib.request, urllib.parse, json, base64, subprocess
          
          method = """${{ github.event.inputs.method_selector }}""".strip()
          raw_input = """${{ github.event.inputs.game_source_input }}""".strip()
          
          if " " in raw_input and method == "ddl":
              url_parts = raw_input.split('?', 1)
              if len(url_parts) == 2:
                  base_part, query_part = url_parts[0], url_parts[1]
                  parsed_queries = urllib.parse.parse_qsl(query_part, keep_blank_values=True)
                  cleaned_query = urllib.parse.urlencode(parsed_queries)
                  raw_url = f"{base_part}?{cleaned_query}"
              else:
                  raw_url = raw_input.replace(" ", "%20")
          else:
              raw_url = raw_input
              
          clean_url = raw_url.lower()
          output_path = "game_input/archive_temp.tmp"
          is_archive = False
          
          if method == "gdrive":
              akey = """${{ secrets.DRIVE_API_KEY }}""".strip()
              domain = base64.b64decode("aHR0cHM6Ly93d3cuZ29vZ2xlYXBpcy5jb20vZHJpdmUvdjMvZmlsZXMv").decode()
              
              meta_url = f"{domain}{raw_url}?key={akey}"
              try:
                  req = urllib.request.Request(meta_url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as response:
                      metadata = json.loads(response.read().decode())
                  filename = metadata.get('name', 'game.nsp').lower()
              except Exception as e:
                  print(f"Metadata check skipped: {e}")
                  filename = "game.nsp"
                  
              is_archive = any(x in filename for x in [".zip", ".rar", ".7z", "compressed", "7z"])
              raw_url = f"{domain}{raw_url}?alt=media&key={akey}"
              if not is_archive:
                  ext = "xci" if ".xci" in filename else "nsp"
                  output_path = f"game_input/game.{ext}"
          else:
              is_archive = any(x in clean_url for x in [".zip", ".rar", ".7z", "compressed", "7z"])
              if not is_archive:
                  ext = "xci" if ".xci" in clean_url else "nsp"
                  output_path = f"game_input/game.{ext}"
                  
          print("Downloading game payload directly to cloud runner...")
          try:
              req = urllib.request.Request(raw_url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response, open(output_path, 'wb') as out_file:
                  block_size = 1024 * 1024
                  while True:
                      buffer = response.read(block_size)
                      if not buffer:
                          break
                      out_file.write(buffer)
              print("Download task complete!")
          except Exception as e:
              print(f"Network error: {e}")
              sys.exit(1)
              
          if is_archive:
              print("Unpacking compressed archive layer...")
              subprocess.run(["7z", "x", "game_input/archive_temp.tmp", "-ogame_input/", "-y"], check=True)
              if os.path.exists("game_input/archive_temp.tmp"):
                  os.remove("game_input/archive_temp.tmp")
          EOF
          
          python3 process_game.py
          
          echo "Searching for game contents inside workspace folder..."
          TARGET_FILE=$(find game_input -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.NSP" -o -name "*.XCI" \) -print -quit)
          
          if [ -z "$TARGET_FILE" ]; then
            echo "Error: No valid .nsp or .xci payload found inside the download source."
            exit 1
          fi
          
          RAW_EXT="${TARGET_FILE##*.}"
          EXTENSION=$(echo "$RAW_EXT" | tr '[:upper:]' '[:lower:]')
          
          mv "$TARGET_FILE" "game_input/game.${EXTENSION}"
          echo "Target game verified and configured as: game.${EXTENSION}"

      - name: Run Build Script
        env:
          TARGET: ${{ github.event.inputs.build_target }}
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
        run: |
          echo "Bypassing the broken prebuild execution wrapper completely..."
          python3 -c '
          import os
          for r, d, fs in os.walk("."):
              for f in fs:
                  if f.endswith(".py"):
                      fp = os.path.join(r, f)
                      try:
                          with open(fp, "r", errors="ignore") as file: src = file.read()
                          if "run_pipeline_prebuild" in src or "pso_prebuild" in src:
                              src = src.replace("self.run_pipeline_prebuild()", "pass")
                              src = src.replace("run_pipeline_prebuild()", "pass")
                              src = src.replace("pso_prebuild", "pso_skip")
                              with open(fp, "w") as file: file.write(src)
                      except Exception: pass
          '
          
          echo "Starting compilation framework loop..."
          export SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          python3 scripts/build_ipa_from_nsp.py game_input --prepare-xcode -k keys_input/prod.keys > build_output.log 2>&1 || (tail -n 100 build_output.log && exit 1)
          echo "Compilation finished successfully!"

      - name: Assemble Standalone Mac App Bundle
        if: ${{ github.event.inputs.build_target == 'macos' }}
        run: |
          echo "Executing manual application packaging as outlined in Step 8 of the developer guide..."
          GAME_NAME="${{ github.event.inputs.artifact_name }}"
          
          B_DIR=$(ls -d game_input/*_build | head -n 1)
          TID=$(basename "$B_DIR" _build)
          P_DIR=$(ls -d "$B_DIR"/patched_v*/ | sort -V | tail -n 1)
          P_DIR="${P_DIR%/}"
          V_NUM="${P_DIR##*patched_}"
          
          APP_DIR="game_input/$GAME_NAME.app"
          R_DIR="$APP_DIR/Contents/Resources"
          
          mkdir -p "$R_DIR/patched" "$R_DIR/romfs" "$R_DIR/msl" "$R_DIR/font" "$R_DIR/profile" "$APP_DIR/Contents/MacOS"
          
          cp -c "$B_DIR/tools/dmhost" "$R_DIR/" || cp "$B_DIR/tools/dmhost" "$R_DIR/"
          cp -cR "$P_DIR/" "$R_DIR/patched/" || cp -R "$P_DIR/" "$R_DIR/patched/"
          cp -cR "$B_DIR/extract/$V_NUM/RomFS/" "$R_DIR/romfs/" || cp -R "$B_DIR/extract/$V_NUM/RomFS/" "$R_DIR/romfs/"
          cp -cR "$B_DIR/shader/cache/" "$R_DIR/msl/" || cp -R "$B_DIR/shader/cache/" "$R_DIR/msl/"
          cp -cR "$B_DIR/font/" "$R_DIR/font/" || cp -R "$B_DIR/font/" "$R_DIR/font/"
          cp -cR dm/games/$TID/ "$R_DIR/profile/" || true
          [ -d "$B_DIR/aoc" ] && (cp -cR "$B_DIR/aoc/" "$R_DIR/aoc/" || cp -R "$B_DIR/aoc/" "$R_DIR/aoc/")
          
          printf '%s\n' '#!/bin/bash' \
          'R="$(cd "$(dirname "$0")/../Resources" && pwd)"' \
          'N="$(basename "$(dirname "$(dirname "$R")")" .app)"' \
          'D="$HOME/Library/Application Support/$N"' \
          'mkdir -p "$D/save" "$D/temp"; cd "$D"' \
          'export DM_ROOT="$D" DM_SAVE="$D/save" DM_TEMP="$D/temp" DM_ROMFS="$R/romfs" DM_MSL_DIR="$R/msl" DM_FONT_DIR="$R/font" DM_LANG=en-US DM_WINDOW=1 DM_AUDIO=1' \
          '[ -f "$R/profile/shader_map.tsv" ] && export DM_NVN_SHMAP="$R/profile/shader_map.tsv"' \
          '[ -d "$R/aoc" ] && export DM_AOC_DIR="$R/aoc"' \
          'exec "$R/dmhost" "$R/patched" > "$D/log.txt" 2>&1' > "$APP_DIR/Contents/MacOS/launch"
          
          chmod +x "$APP_DIR/Contents/MacOS/launch"
          
          plutil -create xml1 "$APP_DIR/Contents/Info.plist"
          for kv in "CFBundleExecutable launch" "CFBundleName $GAME_NAME" "CFBundleIdentifier org.nxnative.mac.$TID" "CFBundlePackageType APPL" "CFBundleIconFile AppIcon"; do 
            plutil -insert "${kv%% *}" -string "${kv#* }" "$APP_DIR/Contents/Info.plist"
          done

          IMG_SRC=$(find "$B_DIR"/extract -type f -name "icon.jpg" -print -quit)
          if [ -n "$IMG_SRC" ] && [ -f "$IMG_SRC" ]; then
            sips -s format icns "$IMG_SRC" --out "$R_DIR/AppIcon.icns" >/dev/null || true
          fi

          hdiutil create \
            -volname "$GAME_NAME" \
            -srcfolder "$APP_DIR" \
            -ov \
            -format UDZO \
            "game_input/$GAME_NAME.dmg"

          echo "Mac Desktop Bundle Created Successfully!"

      - name: Package iOS App Bundle
        if: ${{ github.event.inputs.build_target == 'ios' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Packaging mobile package payload variables..."

          IPA_FILE=$(find game_input -type f -name "*.ipa" -print -quit)

          if [ -z "$IPA_FILE" ]; then
            echo "Error: No IPA file found."
            exit 1
          fi

          mv "$IPA_FILE" "game_input/${{ github.event.inputs.artifact_name }}.ipa"

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: |
            game_input/*.ipa
            game_input/*.dmg
          if-no-files-found: error
