name: Build Universal Switch App via Direct URL

on:
  workflow_dispatch:
    inputs:
      game_download_url:
        description: 'Paste the direct download URL (Supports .nsp, .xci, .zip, .rar, .7z)'
        required: true
        type: string
      artifact_name:
        description: 'Name of the output app (e.g., Mario-Wonder)'
        required: true
        default: 'Switch-Game-App'
        type: string
      build_target:
        description: 'Choose your target platform'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - macos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install macOS Dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang p7zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET Runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'" pycryptodome zstandard

      - name: Setup Workspace Directories
        run: |
          mkdir -p game_input
          mkdir -p keys_input

      - name: Deploy Raw Keys
        run: |
          cat << 'EOF' > keys_input/prod.keys
          ${{ secrets.BASE64_KEYS }}
          EOF
          sed -i '' 's/\r$//' keys_input/prod.keys

      - name: Direct Cloud-to-Cloud Download & Auto-Extract
        run: |
          # Write the download logic inside an isolated script block to eliminate Bash shell parsing conflicts completely
          cat << 'EOF' > download_engine.py
          import sys, os, urllib.request, subprocess
          
          # Safely fetch the raw string asset directly from the workflow input variable context
          raw_url = """${{ github.event.inputs.game_download_url }}""".strip()
          clean_url = raw_url.lower()
          
          print("Downloading game payload directly to cloud runner...")
          is_archive = any(x in clean_url for x in [".zip", ".rar", ".7z", "compressed", "7z"])
          
          if is_archive:
              print("Archive format detected. Staging temporary archive payload...")
              output_path = "game_input/archive_temp.tmp"
          else:
              ext = "xci" if ".xci" in clean_url else "nsp"
              output_path = f"game_input/game.{ext}"
              
          try:
              # Download payload using Python's native network sockets to dodge character escape drops
              req = urllib.request.Request(raw_url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response, open(output_path, 'wb') as out_file:
                  # Stream the file data safely
                  block_size = 1024 * 1024
                  while True:
                      buffer = response.read(block_size)
                      if not buffer:
                          break
                      out_file.write(buffer)
              print("Download network task complete!")
          except Exception as e:
              print(f"Network error encountered: {e}")
              sys.exit(1)
              
          if is_archive:
              print("Unpacking the compressed archive layout via 7zz system layer...")
              subprocess.run(["7zz", "x", "game_input/archive_temp.tmp", "-ogame_input/", "-y"], check=True)
              if os.path.exists("game_input/archive_temp.tmp"):
                  os.remove("game_input/archive_temp.tmp")
          EOF
          
          python3 download_engine.py
          
          echo "Searching for game contents inside workspace folder..."
          # Locate the unpacked binary files recursively
          TARGET_FILE=$(find game_input -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.NSP" -o -name "*.XCI" \) -print -quit)
          
          if [ -z "$TARGET_FILE" ]; then
            echo "Error: No valid .nsp or .xci payload found inside the download source."
            exit 1
          fi
          
          RAW_EXT="${TARGET_FILE##*.}"
          EXTENSION=$(echo "$RAW_EXT" | tr '[:upper:]' '[:lower:]')
          
          # Standardise filename paths for the compiler runner steps
          mv "$TARGET_FILE" "game_input/game.${EXTENSION}"
          echo "Target game verified and configured as: game.${EXTENSION}"

      - name: Run Build Script
        run: |
          echo "Starting nxnative compilation... This can take a few minutes."
          python3 scripts/build_ipa_from_nsp.py game_input > build_output.log 2>&1 || (tail -n 100 build_output.log && exit 1)
          echo "Compilation finished successfully!"

      - name: Package Mac App to DMG
        if: ${{ github.event.inputs.build_target == 'macos' }}
        run: |
          cd game_input
          APP_NAME=$(find . -maxdepth 1 -name "*.app" -print -quit)
          if [ -n "$APP_NAME" ]; then
            hdiutil create -volname "${{ github.event.inputs.artifact_name }}" -srcfolder "$APP_NAME" -ov -format UDZO "${{ github.event.inputs.artifact_name }}.dmg"
          else
            echo "Error: No compiled Mac app bundle found."
            exit 1
          fi

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: |
            game_input/*.ipa
            game_input/*.dmg
