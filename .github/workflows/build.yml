name: Build Universal Switch App

on:
  workflow_dispatch:
    inputs:
      method:
        description: 'Download method'
        required: true
        default: 'ddl'
        type: choice
        options:
          - ddl       # Direct HTTP/HTTPS URL (pre-signed or public)
          - r2        # Cloudflare R2 (generates fresh signed URL at runtime)
          - gdrive    # Google Drive file ID
      source:
        description: 'Game URL (ddl/r2) or File ID (gdrive)'
        required: true
        type: string
      update_source:
        description: 'Update URL/ID (optional)'
        required: false
        default: ''
        type: string
      dlc_source:
        description: 'DLC URL/ID (optional)'
        required: false
        default: ''
        type: string
      # R2 credentials (from repo secrets, only needed if method=r2)
      # Configure in Settings → Secrets → Actions: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
      artifact_name:
        description: 'Output app name (e.g., Zelda-TOTK)'
        required: true
        default: 'Switch-Game'
        type: string
      platform:
        description: 'Target platform'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - macos

permissions:
  contents: read

jobs:
  build:
    name: Build App (${{ inputs.platform }})
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      METHOD: ${{ inputs.method }}
      SOURCE: ${{ inputs.source }}
      UPDATE_SOURCE: ${{ inputs.update_source }}
      DLC_SOURCE: ${{ inputs.dlc_source }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      PLATFORM: ${{ inputs.platform }}

    steps:
      - name: Checkout nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          persist-credentials: false

      - name: Install macOS Dependencies
        run: |
          brew install xcodegen zstd glslang p7zip
          brew install --cask dotnet-sdk
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'" boto3 botocore

      - name: Prepare Keys (matches old working workflow)
        run: |
          mkdir -p keys_input
          cat << 'EOF' > keys_input/prod.keys
          ${{ secrets.BASE64_KEYS }}
          EOF
          sed -i '' 's/\r$//' keys_input/prod.keys
          # Auto-detect base64 vs raw
          if [ "$(wc -l < keys_input/prod.keys)" -eq 1 ] && grep -qE '^[A-Za-z0-9+/=]+$' keys_input/prod.keys; then
            base64 -d keys_input/prod.keys > keys_input/prod.keys.decoded 2>/dev/null && mv keys_input/prod.keys.decoded keys_input/prod.keys
            echo "Decoded base64 keys"
          else
            echo "Using raw keys"
          fi

      - name: Download Game, Update, DLC
        run: |
          python3 << 'PYEOF'
          import os, sys, subprocess, urllib.parse, urllib.request, json, base64, boto3, botocore
          from botocore.config import Config

          method = os.environ['METHOD']
          source = os.environ['SOURCE']
          update_source = os.environ.get('UPDATE_SOURCE', '').strip()
          dlc_source = os.environ.get('DLC_SOURCE', '').strip()
          os.makedirs('game_input', exist_ok=True)

          # ===== Helpers =====
          def clean_url(raw):
              """Clean URL: fix spaces, preserve query params (from old workflow)"""
              if " " in raw and method == "ddl":
                  parts = raw.split('?', 1)
                  if len(parts) == 2:
                      base, query = parts
                      parsed = urllib.parse.parse_qsl(query, keep_blank_values=True)
                      return f"{base}?{urllib.parse.urlencode(parsed)}"
                  return raw.replace(" ", "%20")
              return raw

          def is_archive(url):
              return any(x in url.lower() for x in ['.zip', '.rar', '.7z', 'compressed'])

          def download_direct(url, out_path):
              print(f"Downloading: {out_path}")
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as resp, open(out_path, 'wb') as f:
                  while chunk := resp.read(1024*1024):
                      f.write(chunk)

          def download_gdrive(file_id, out_path):
              api_key = os.environ.get('DRIVE_API_KEY', '').strip()
              if not api_key:
                  sys.exit("DRIVE_API_KEY secret not set")
              domain = base64.b64decode("aHR0cHM6Ly93d3cuZ29vZ2xlYXBpcy5jb20vZHJpdmUvdjMvZmlsZXMv").decode()
              # Try get filename from metadata
              try:
                  meta_url = f"{domain}{file_id}?key={api_key}"
                  req = urllib.request.Request(meta_url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as resp:
                      meta = json.loads(resp.read().decode())
                  filename = meta.get('name', 'game.nsp').lower()
              except:
                  filename = "game.nsp"
              dl_url = f"{domain}{file_id}?alt=media&key={api_key}"
              download_direct(dl_url, out_path)
              return filename

          def get_r2_client():
              account_id = os.environ.get('R2_ACCOUNT_ID')
              access_key = os.environ.get('R2_ACCESS_KEY_ID')
              secret_key = os.environ.get('R2_SECRET_ACCESS_KEY')
              if not all([account_id, access_key, secret_key]):
                  return None
              endpoint = f"https://{account_id}.r2.cloudflarestorage.com"
              return boto3.client(
                  's3', endpoint_url=endpoint,
                  aws_access_key_id=access_key, aws_secret_access_key=secret_key,
                  config=Config(signature_version='s3v4'), region_name='auto'
              )

          def parse_r2_key(base_url):
              bucket = os.environ.get('R2_BUCKET', '')
              parsed = urllib.parse.urlparse(base_url)
              path = parsed.path.lstrip('/')
              if bucket and path.startswith(bucket + '/'):
                  path = path[len(bucket) + 1:]
              return path

          def download_r2(s3, object_key, out_path, archive=False):
              bucket = os.environ['R2_BUCKET']
              url = s3.generate_presigned_url('get_object', Params={'Bucket': bucket, 'Key': object_key}, ExpiresIn=7200)
              print(f"Downloading (R2): {out_path}")
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as resp, open(out_path, 'wb') as f:
                  while chunk := resp.read(1024*1024):
                      f.write(chunk)
              if archive:
                  subprocess.run(['7z', 'x', out_path, '-ogame_input/', '-y'], check=True)
                  os.remove(out_path)

          def find_game_file(exclude=()):
              for root, _, files in os.walk('game_input'):
                  for f in files:
                      if f.lower().endswith(('.nsp', '.xci')) and not any(f.startswith(p) for p in exclude):
                          return os.path.join(root, f)
              return None

          def download_file(kind, src, tmp_name, s3=None):
              archive = is_archive(src)
              tmp = f'game_input/{tmp_name}.tmp' if archive else f'game_input/{tmp_name}.bin'

              if method == 'ddl':
                  download_direct(clean_url(src), tmp)
              elif method == 'r2':
                  if not s3:
                      sys.exit(f"R2 method requires R2 secrets for {kind}")
                  download_r2(s3, parse_r2_key(src), tmp, archive)
              elif method == 'gdrive':
                  download_gdrive(src, tmp)
              else:
                  sys.exit(f"Unknown method: {method}")

              if archive:
                  print(f"Extracting {kind} archive...")
                  subprocess.run(['7z', 'x', tmp, '-ogame_input/', '-y'], check=True)
                  os.remove(tmp)

          # ===== Main =====
          s3 = get_r2_client() if method == 'r2' else None

          # GAME (required)
          download_file('game', source, 'game', s3)
          game_file = find_game_file(exclude=('game_update.', 'game_dlc.'))
          if not game_file:
              sys.exit("No .nsp/.xci found for game")
          ext = 'xci' if '.xci' in game_file.lower() else 'nsp'
          os.rename(game_file, f'game_input/game.{ext}')
          print(f"Game: game_input/game.{ext}")
          with open('game_input/.ext', 'w') as f:
              f.write(ext)

          # UPDATE (optional)
          if update_source:
              download_file('update', update_source, 'update', s3)
              upd = find_game_file(exclude=('game.', 'game_dlc.'))
              if upd:
                  uext = 'xci' if '.xci' in upd.lower() else 'nsp'
                  os.rename(upd, f'game_input/game_update.{uext}')
                  print(f"Update: game_input/game_update.{uext}")

          # DLC (optional)
          if dlc_source:
              download_file('dlc', dlc_source, 'dlc', s3)
              dlc = find_game_file(exclude=('game.', 'game_update.'))
              if dlc:
                  dext = 'xci' if '.xci' in dlc.lower() else 'nsp'
                  os.rename(dlc, f'game_input/game_dlc.{dext}')
                  print(f"DLC: game_input/game_dlc.{dext}")

          PYEOF

      - name: Build IPA / App
        run: |
          set -euo pipefail
          EXT=$(cat game_input/.ext)
          GAME="game_input/game.${EXT}"

          echo "Building ${PLATFORM} from ${GAME}"

          # Disable prebuild download in build script (we already have files)
          if [ -f scripts/build_ipa_from_nsp.py ]; then
            sed -i.bak 's/^\(.*download_game.*\)$/# \1  # DISABLED/' scripts/build_ipa_from_nsp.py
            sed -i.bak 's/^\(.*fetch_game.*\)$/# \1  # DISABLED/' scripts/build_ipa_from_nsp.py
            sed -i.bak 's/^\(.*pso_prebuild.*\)$/# \1  # DISABLED/' scripts/build_ipa_from_nsp.py
          fi

          if [ "${PLATFORM}" = "ios" ]; then
            python3 scripts/build_ipa_from_nsp.py "${GAME}" -k keys_input/prod.keys --platform ios
          else
            python3 scripts/build_ipa_from_nsp.py "${GAME}" -k keys_input/prod.keys --platform mac-app --gpu none
          fi

      - name: Package Output (matches old workflow)
        run: |
          set -euo pipefail
          NAME="${ARTIFACT_NAME}"
          if [ "${PLATFORM}" = "ios" ]; then
            IPA=$(find . -name "*.ipa" -maxdepth 3 | head -1)
            [ -n "$IPA" ] || { echo "No IPA found"; exit 1; }
            mv "$IPA" "${NAME}.ipa"
            echo "Created ${NAME}.ipa"
          else
            APP=$(find . -name "*.app" -maxdepth 3 | head -1)
            [ -n "$APP" ] || { echo "No .app found"; exit 1; }
            hdiutil create -volname "$NAME" -srcfolder "$APP" -ov -format UDZO "${NAME}.dmg"
            echo "Created ${NAME}.dmg"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            *.ipa
            *.dmg
          retention-days: 7
          if-no-files-found: error
