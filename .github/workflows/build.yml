name: Build Universal Switch App

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive File ID of your game (.nsp or .xci)'
        required: true
        type: string
      artifact_name:
        description: 'Name of the output app (e.g., Mario-Wonder)'
        required: true
        default: 'Switch-Game-App'
        type: string
      build_target:
        description: 'Choose your target platform'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - macos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install macOS Dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang

      - name: Setup .NET Runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'" pycryptodome zstandard

      - name: Setup Workspace Directories
        run: |
          mkdir -p game_input
          mkdir -p keys_input

      - name: Deploy Raw Keys
        run: |
          cat << 'EOF' > keys_input/prod.keys
          ${{ secrets.BASE64_KEYS }}
          EOF
          sed -i '' 's/\r$//' keys_input/prod.keys

      - name: Download Game File via API
        run: |
          cat << 'EOF' > download_game.py
          import os, sys, urllib.request, json, base64
          
          fid = """${{ github.event.inputs.drive_file_id }}""".strip()
          akey = """${{ secrets.DRIVE_API_KEY }}""".strip()
          
          domain = base64.b64decode("aHR0cHM6Ly93d3cuZ29vZ2xlYXBpcy5jb20vZHJpdmUvdjMvZmlsZXMv").decode()
          
          # 1. Fetch metadata safely
          meta_url = f"{domain}{fid}?key={akey}"
          try:
              req = urllib.request.Request(meta_url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  metadata = json.loads(response.read().decode())
              filename = metadata.get('name', 'game.nsp')
          except Exception as e:
              print(f"Metadata check skipped or failed: {e}")
              filename = "game.nsp"
              
          extension = "xci" if filename.lower().endswith('.xci') else "nsp"
          print(f"Detected file extension: .{extension}")
          
          # 2. Download binary payload
          dl_url = f"{domain}{fid}?alt=media&key={akey}"
          output_path = f"game_input/game.{extension}"
          
          print("Downloading game file... This will take a moment.")
          urllib.request.urlretrieve(dl_url, output_path)
          print("Download complete!")
          EOF
          
          python3 download_game.py

      - name: Run Build Script
        env:
          TARGET: ${{ github.event.inputs.build_target }}
        run: |
          echo "Starting nxnative compilation for target: $TARGET..."
          
          # Check if the platform selection requires the specific Mac flag
          if [ "$TARGET" = "macos" ]; then
            # Appends the mac build flag dynamically to the execution string
            python3 scripts/build_ipa_from_nsp.py game_input --mac -k keys_input/prod.keys > build_output.log 2>&1 || (tail -n 100 build_output.log && exit 1)
          else
            python3 scripts/build_ipa_from_nsp.py game_input -k keys_input/prod.keys > build_output.log 2>&1 || (tail -n 100 build_output.log && exit 1)
          fi
          
          echo "Compilation finished successfully!"

      - name: Package Mac App to DMG
        if: ${{ github.event.inputs.build_target == 'macos' }}
        run: |
          # Finds the compiled .app bundle and packs it safely into a shareable disk image
          cd game_input
          APP_NAME=$(find . -maxdepth 1 -name "*.app" -print -quit)
          if [ -n "$APP_NAME" ]; then
            hdiutil create -volname "${{ github.event.inputs.artifact_name }}" -srcfolder "$APP_NAME" -ov -format UDZO "${{ github.event.inputs.artifact_name }}.dmg"
          else
            echo "Error: No compiled Mac app bundle found."
            exit 1
          fi

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: |
            game_input/*.ipa
            game_input/*.dmg
