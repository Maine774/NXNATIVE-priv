name: Build Universal Switch App via Tailscale

on:
  workflow_dispatch:
    inputs:
      warning_message:
        description: '⚠️ BEFORE RUNNING: Open terminal on laptop and run the two commands shown below!'
        required: false
        default: 'Read instructions in fields below 👇'
        type: string
      command_step_1:
        description: 'Step 1 Command (WSL/Linux):'
        required: false
        default: 'cd "/mnt/c/Users/LOK0008/Downloads/Switch Roms"'
        type: string
      command_step_2:
        description: 'Step 2 Command (Start Server):'
        required: false
        default: 'python3 -m http.server 8080'
        type: string
      laptop_tailscale_ip:
        description: 'Your Laptop Tailscale IP (Starts with 100.)'
        required: true
        type: string
      game_filename:
        description: 'Exact name of the file on your laptop (e.g., Zelda.nsp or Mario.xci)'
        required: true
        type: string
      artifact_name:
        description: 'Name of the output app (e.g., Mario-Wonder)'
        required: true
        default: 'Switch-Game-App'
        type: string
      build_target:
        description: 'Choose your target platform'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - macos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup and Initialize Tailscale on macOS
        env:
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          echo "Installing Tailscale via Homebrew..."
          brew install tailscale
          
          echo "Starting the Tailscale backend engine with a secure SOCKS5 proxy..."
          sudo tailscaled --tun=userspace-networking --socks5-server=localhost:1055 &
          sleep 5
          
          echo "Connecting to your private mesh network..."
          sudo tailscale up --authkey="${TS_SECRET}" --hostname="gh-mac-runner" --timeout=5m || true
          
          echo "Verifying network node connectivity..."
          sleep 5
          tailscale status || true

      - name: Install macOS Dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET Runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'" pycryptodome zstandard

      - name: Setup Workspace Directories
        run: |
          mkdir -p game_input
          mkdir -p keys_input

      - name: Deploy Raw Keys
        run: |
          cat << 'EOF' > keys_input/prod.keys
          ${{ secrets.BASE64_KEYS }}
          EOF
          sed -i '' 's/\r$//' keys_input/prod.keys

      - name: Pull File Directly From Laptop
        env:
          LAPTOP_IP: ${{ github.event.inputs.laptop_tailscale_ip }}
          FILE_NAME: ${{ github.event.inputs.game_filename }}
        run: |
          if [[ "$FILE_NAME" == *.xci ]]; then
            EXTENSION="xci"
          else
            EXTENSION="nsp"
          fi
          
          echo "Connecting to Python Server at $LAPTOP_IP:8080 over Tailscale SOCKS5 Proxy..."
          
          # URL-encode the filename spaces natively inside python so curl doesn't break
          ENCODED_NAME=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$FILE_NAME")
          
          # Using curl's built-in SOCKS5 engine guarantees the traffic routes straight through the tailscale tunnel
          curl -L --socks5-hostname localhost:1055 -o "game_input/game.${EXTENSION}" "http://${LAPTOP_IP}:8080/${ENCODED_NAME}"
          
          echo "File downloaded successfully!"

      - name: Run Build Script
        env:
          TARGET: ${{ github.event.inputs.build_target }}
        run: |
          echo "Starting nxnative compilation for target: $TARGET..."
          if [ "$TARGET" = "macos" ]; then
            python3 scripts/build_ipa_from_nsp.py game_input --platform mac --prepare-xcode -k keys_input/prod.keys > build_output.log 2>&1 || (tail -n 100 build_output.log && exit 1)
          else
            python3 scripts/build_ipa_from_nsp.py game_input --platform ios -k keys_input/prod.keys > build_output.log 2>&1 || (tail -n 100 build_output.log && exit 1)
          fi
          echo "Compilation finished successfully!"

      - name: Package Mac App to DMG
        if: ${{ github.event.inputs.build_target == 'macos' }}
        run: |
          cd game_input
          APP_NAME=$(find . -maxdepth 1 -name "*.app" -print -quit)
          if [ -n "$APP_NAME" ]; then
            hdiutil create -volname "${{ github.event.inputs.artifact_name }}" -srcfolder "$APP_NAME" -ov -format UDZO "${{ github.event.inputs.artifact_name }}.dmg"
          else
            echo "Error: No compiled Mac app bundle found."
            exit 1
          fi

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: |
            game_input/*.ipa
            game_input/*.dmg
