name: Build Universal Switch App via Direct URL

on:
  workflow_dispatch:
    inputs:
      game_download_url:
        description: 'Paste the direct download URL of your .nsp or .xci'
        required: true
        type: string
      artifact_name:
        description: 'Name of the output app (e.g., Mario-Wonder)'
        required: true
        default: 'Switch-Game-App'
        type: string
      build_target:
        description: 'Choose your target platform'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - macos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install macOS Dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET Runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'" pycryptodome zstandard

      - name: Setup Workspace Directories
        run: |
          mkdir -p game_input
          mkdir -p keys_input

      - name: Deploy Raw Keys
        run: |
          cat << 'EOF' > keys_input/prod.keys
          ${{ secrets.BASE64_KEYS }}
          EOF
          sed -i '' 's/\r$//' keys_input/prod.keys

      - name: Direct Cloud-to-Cloud Download
        env:
          DL_URL: ${{ github.event.inputs.game_download_url }}
        run: |
          # Automatically detect if the destination file string is an XCI or NSP container
          if [[ "$DL_URL" == *.xci* ]]; then
            EXTENSION="xci"
          else
            EXTENSION="nsp"
          fi
          
          echo "Downloading game payload directly to cloud runner from target host..."
          # This pulls the file directly down at data center speeds, completely bypassing your local network upload caps
          curl -L -o "game_input/game.${EXTENSION}" "$DL_URL"
          echo "Download complete!"

      - name: Run Build Script
        env:
          TARGET: ${{ github.event.inputs.build_target }}
        run: |
          echo "Starting nxnative compilation for target: $TARGET..."
          if [ "$TARGET" = "macos" ]; then
            python3 scripts/build_ipa_from_nsp.py game_input --platform mac --prepare-xcode -k keys_input/prod.keys > build_output.log 2>&1 || (tail -n 100 build_output.log && exit 1)
          else
            python3 scripts/build_ipa_from_nsp.py game_input --platform ios -k keys_input/prod.keys > build_output.log 2>&1 || (tail -n 100 build_output.log && exit 1)
          fi
          echo "Compilation finished successfully!"

      - name: Package Mac App to DMG
        if: ${{ github.event.inputs.build_target == 'macos' }}
        run: |
          cd game_input
          APP_NAME=$(find . -maxdepth 1 -name "*.app" -print -quit)
          if [ -n "$APP_NAME" ]; then
            hdiutil create -volname "${{ github.event.inputs.artifact_name }}" -srcfolder "$APP_NAME" -ov -format UDZO "${{ github.event.inputs.artifact_name }}.dmg"
          else
            echo "Error: No compiled Mac app bundle found."
            exit 1
          fi

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: |
            game_input/*.ipa
            game_input/*.dmg
