name: Build Universal Switch IPA

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive File ID of your game (.nsp or .xci)'
        required: true
        type: string
      artifact_name:
        description: 'Name of the output app (e.g., Mario-Wonder)'
        required: true
        default: 'Switch-Game-IPA'
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install macOS Dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang

      - name: Install Python Dependencies
        run: |
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'" pycryptodome zstandard

      - name: Setup Workspace Directories
        run: |
          mkdir -p game_input
          mkdir -p keys_input

      - name: Deploy Raw Keys
        run: |
          cat << 'EOF' > keys_input/prod.keys
          ${{ secrets.BASE64_KEYS }}
          EOF
          sed -i '' 's/\r$//' keys_input/prod.keys

      - name: Download Game File via API
        env:
          FID: ${{ github.event.inputs.drive_file_id }}
          AKEY: ${{ secrets.DRIVE_API_KEY }}
        run: |
          # Clean variables to remove spaces or line breaks
          CLEAN_FID=$(echo "$FID" | tr -d '[:space:]')
          CLEAN_KEY=$(echo "$AKEY" | tr -d '[:space:]')

          # 1. Fetch metadata using the correct Google API URL structure
          URL_META="https://googleapis.com{CLEAN_FID}?key=${CLEAN_KEY}"
          METADATA=$(curl -s -L "$URL_META")
          
          NAME=$(echo "$METADATA" | grep -o '"name": "[^"]*' | head -n 1 | sed 's/"name": "//')
          
          if [[ "$NAME" == *.xci ]]; then
            EXTENSION="xci"
          else
            EXTENSION="nsp"
          fi
          
          echo "Detected file type: .$EXTENSION"
          
          # 2. Download game payload using the correct Google API URL structure
          URL_DL="https://googleapis.com{CLEAN_FID}?alt=media&key=${CLEAN_KEY}"
          curl -L -o "game_input/game.${EXTENSION}" "$URL_DL"

      - name: Run Build Script
        run: |
          echo "Starting nxnative compilation... This can take a few minutes."
          python3 scripts/build_ipa_from_nsp.py game_input -k keys_input/prod.keys > build_output.log 2>&1 || (tail -n 100 build_output.log && exit 1)
          echo "Compilation finished successfully!"

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: game_input/*.ipa
