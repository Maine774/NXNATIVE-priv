name: Build Universal Switch App via Direct URL

on:
  workflow_dispatch:
    inputs:
      game_download_url:
        description: 'Paste the direct download URL (Supports .nsp, .xci, .zip, .rar, .7z)'
        required: true
        type: string
      artifact_name:
        description: 'Name of the output app (e.g., Mario-Wonder)'
        required: true
        default: 'Switch-Game-App'
        type: string
      build_target:
        description: 'Choose your target platform'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - macos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install macOS Dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang p7zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET Runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'" pycryptodome zstandard

      - name: Setup Workspace Directories
        run: |
          mkdir -p game_input
          mkdir -p keys_input

      - name: Deploy Raw Keys
        run: |
          cat << 'EOF' > keys_input/prod.keys
          ${{ secrets.BASE64_KEYS }}
          EOF
          sed -i '' 's/\r$//' keys_input/prod.keys

      - name: Direct Cloud-to-Cloud Download & Auto-Extract
        run: |
          # 1. Write the raw URL input safely to a file using Python to bypass shell parsing bugs completely
          python3 -c 'import sys; open("url.txt", "w").write(sys.argv[1].strip())' "${{ github.event.inputs.game_download_url }}"
          
          # Read the clean string back into a standard local variable safely
          DL_URL=$(cat url.txt)
          CLEAN_URL=$(echo "$DL_URL" | tr '[:upper:]' '[:lower:]')
          
          echo "Downloading game payload directly to cloud runner..."
          
          # 2. Determine if the source data string represents a compressed file signature
          if [[ "$CLEAN_URL" == *.zip* ]] || [[ "$CLEAN_URL" == *.rar* ]] || [[ "$CLEAN_URL" == *.7z* ]] || [[ "$CLEAN_URL" == *compressed* ]] || [[ "$CLEAN_URL" == *7z* ]]; then
            echo "Archive format detected. Staging temporary archive payload..."
            curl -L -o "game_input/archive_temp.tmp" "$DL_URL"
            
            echo "Unpacking the compressed archive..."
            7zz x "game_input/archive_temp.tmp" -ogame_input/ -y
            rm -f game_input/archive_temp.tmp
          else
            if [[ "$CLEAN_URL" == *.xci* ]]; then EXT="xci"; else EXT="nsp"; fi
            curl -L -o "game_input/game.${EXT}" "$DL_URL"
          fi
          
          rm -f url.txt
          
          echo "Searching for game contents inside workspace folder..."
          # 3. Locate the unpacked binary assets recursively
          TARGET_FILE=$(find game_input -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.NSP" -o -name "*.XCI" \) -print -quit)
          
          if [ -z "$TARGET_FILE" ]; then
            echo "Error: No valid .nsp or .xci payload found inside the download source."
            exit 1
          fi
          
          RAW_EXT="${TARGET_FILE##*.}"
          EXTENSION=$(echo "$RAW_EXT" | tr '[:upper:]' '[:lower:]')
          
          # 4. Normalise filenames for the compilation pipeline step rules
          mv "$TARGET_FILE" "game_input/game.${EXTENSION}"
          echo "Target game verified and configured as: game.${EXTENSION}"

      - name: Run Build Script
        run: |
          echo "Starting nxnative compilation... This can take a few minutes."
          python3 scripts/build_ipa_from_nsp.py game_input > build_output.log 2>&1 || (tail -n 100 build_output.log && exit 1)
          echo "Compilation finished successfully!"

      - name: Package Mac App to DMG
        if: ${{ github.event.inputs.build_target == 'macos' }}
        run: |
          cd game_input
          APP_NAME=$(find . -maxdepth 1 -name "*.app" -print -quit)
          if [ -n "$APP_NAME" ]; then
            hdiutil create -volname "${{ github.event.inputs.artifact_name }}" -srcfolder "$APP_NAME" -ov -format UDZO "${{ github.event.inputs.artifact_name }}.dmg"
          else
            echo "Error: No compiled Mac app bundle found."
            exit 1
          fi

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: |
            game_input/*.ipa
            game_input/*.dmg
