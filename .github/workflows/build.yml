name: Build NXNATIVE IPA/APP

on:
  workflow_dispatch:
    inputs:
      method_selector:
        description: 'Download method'
        required: true
        default: 'ddl'
        type: choice
        options:
          - ddl
          - gdrive
      # Base URLs (NOT pre-signed) - these don't expire
      game_source_base:
        description: 'Base URL for game (no signature params)'
        required: true
        type: string
      update_source_base:
        description: 'Base URL for update (optional, no signature params)'
        required: false
        type: string
      dlc_source_base:
        description: 'Base URL for DLC (optional, no signature params)'
        required: false
        type: string
      # R2/S3 credentials for signing at runtime
      r2_account_id:
        description: 'R2 Account ID'
        required: true
        type: string
      r2_access_key_id:
        description: 'R2 Access Key ID'
        required: true
        type: string
      r2_secret_access_key:
        description: 'R2 Secret Access Key'
        required: true
        type: string
      r2_bucket:
        description: 'R2 Bucket name'
        required: true
        type: string
      artifact_name:
        description: 'Artifact name'
        required: true
        default: 'nxnative-build'
        type: string
      build_target:
        description: 'Build target'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - macos

permissions:
  contents: read

jobs:
  build:
    name: Build IPA / App
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      # Pass R2 creds to Python script for runtime signing
      R2_ACCOUNT_ID: ${{ inputs.r2_account_id }}
      R2_ACCESS_KEY_ID: ${{ inputs.r2_access_key_id }}
      R2_SECRET_ACCESS_KEY: ${{ inputs.r2_secret_access_key }}
      R2_BUCKET: ${{ inputs.r2_bucket }}
      GAME_SOURCE_BASE: ${{ inputs.game_source_base }}
      UPDATE_SOURCE_BASE: ${{ inputs.update_source_base }}
      DLC_SOURCE_BASE: ${{ inputs.dlc_source_base }}
      METHOD_SELECTOR: ${{ inputs.method_selector }}
      BUILD_TARGET: ${{ inputs.build_target }}

    steps:
      - name: Checkout NXNATIVE
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          persist-credentials: false

      - name: Install macOS Dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang p7zip awscli
          brew install --cask dotnet-sdk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python Dependencies
        run: |
          pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Deploy Raw Keys
        run: |
          mkdir -p keys_input
          echo "${{ secrets.BASE64_KEYS }}" | base64 -d > keys_input/prod.keys

      - name: Generate Fresh Signed URLs & Download Game Data
        run: |
          python3 << 'PYEOF'
          import os, sys, subprocess, urllib.parse, boto3, botocore
          from botocore.config import Config

          # R2 endpoint
          endpoint = f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com"

          s3 = boto3.client(
              's3',
              endpoint_url=endpoint,
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              config=Config(signature_version='s3v4'),
              region_name='auto'
          )

          bucket = os.environ['R2_BUCKET']
          method = os.environ['METHOD_SELECTOR']

          def parse_object_key(base_url):
              """Extract object key from base URL (strip query params)"""
              parsed = urllib.parse.urlparse(base_url)
              return parsed.path.lstrip('/')

          def generate_presigned_url(object_key, expires=7200):
              """Generate fresh signed URL valid for 2 hours"""
              return s3.generate_presigned_url(
                  'get_object',
                  Params={'Bucket': bucket, 'Key': object_key},
                  ExpiresIn=expires
              )

          def download_and_extract(url, output_path, is_archive=False):
              """Download with fresh URL, extract if archive"""
              print(f"Downloading: {output_path}")
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as resp, open(output_path, 'wb') as f:
                  while chunk := resp.read(1024*1024):
                      f.write(chunk)
              if is_archive:
                  subprocess.run(['7z', 'x', output_path, '-ogame_input/', '-y'], check=True)
                  os.remove(output_path)

          os.makedirs('game_input', exist_ok=True)

          # --- GAME ---
          game_key = parse_object_key(os.environ['GAME_SOURCE_BASE'])
          game_url = generate_presigned_url(game_key)
          is_archive = any(x in game_key.lower() for x in ['.zip', '.rar', '.7z', 'compressed'])
          download_and_extract(game_url, 'game_input/game.tmp', is_archive)

          # Find the actual game file
          game_file = None
          for root, _, files in os.walk('game_input'):
              for f in files:
                  if f.lower().endswith(('.nsp', '.xci')) and not f.startswith('game_update.') and not f.startswith('game_dlc.'):
                      game_file = os.path.join(root, f)
                      break
              if game_file: break

          if not game_file:
              sys.exit("No game .nsp/.xci found")

          ext = 'xci' if '.xci' in game_file.lower() else 'nsp'
          os.rename(game_file, f'game_input/game.{ext}')
          print(f"Game staged: game_input/game.{ext}")

          # --- UPDATE ---
          if os.environ.get('UPDATE_SOURCE_BASE'):
              upd_key = parse_object_key(os.environ['UPDATE_SOURCE_BASE'])
              upd_url = generate_presigned_url(upd_key)
              is_archive = any(x in upd_key.lower() for x in ['.zip', '.rar', '.7z', 'compressed'])
              download_and_extract(upd_url, 'game_input/update.tmp', is_archive)

              upd_file = None
              for root, _, files in os.walk('game_input'):
                  for f in files:
                      if f.lower().endswith(('.nsp', '.xci')) and not f.startswith('game.') and not f.startswith('game_dlc.'):
                          upd_file = os.path.join(root, f)
                          break
                  if upd_file: break

              if upd_file:
                  ext = 'xci' if '.xci' in upd_file.lower() else 'nsp'
                  os.rename(upd_file, f'game_input/game_update.{ext}')
                  print(f"Update staged: game_input/game_update.{ext}")

          # --- DLC ---
          if os.environ.get('DLC_SOURCE_BASE'):
              dlc_key = parse_object_key(os.environ['DLC_SOURCE_BASE'])
              dlc_url = generate_presigned_url(dlc_key)
              is_archive = any(x in dlc_key.lower() for x in ['.zip', '.rar', '.7z', 'compressed'])
              download_and_extract(dlc_url, 'game_input/dlc.tmp', is_archive)

              dlc_file = None
              for root, _, files in os.walk('game_input'):
                  for f in files:
                      if f.lower().endswith(('.nsp', '.xci')) and not f.startswith('game.') and not f.startswith('game_update.'):
                          dlc_file = os.path.join(root, f)
                          break
                  if dlc_file: break

              if dlc_file:
                  ext = 'xci' if '.xci' in dlc_file.lower() else 'nsp'
                  os.rename(dlc_file, f'game_input/game_dlc.{ext}')
                  print(f"DLC staged: game_input/game_dlc.{ext}")

          PYEOF

      - name: Run Build Script
        run: |
          # Patch out pre-build step that tries to download again
          sed -i.bak '/download_game/d' scripts/build_ipa_from_nsp.py
          sed -i.bak '/fetch_game/d' scripts/build_ipa_from_nsp.py

          if [ "$BUILD_TARGET" = "ios" ]; then
            python3 scripts/build_ipa_from_nsp.py game_input/game.nsp -k keys_input/prod.keys --platform ios
          else
            python3 scripts/build_ipa_from_nsp.py game_input/game.nsp -k keys_input/prod.keys --platform mac-app --gpu none
          fi

      - name: Package macOS App Bundle
        if: inputs.build_target == 'macos'
        run: |
          APP_PATH=$(find . -name "*.app" -maxdepth 3 | head -1)
          if [ -n "$APP_PATH" ]; then
            hdiutil create -volname "${{ inputs.artifact_name }}" -srcfolder "$APP_PATH" -ov -format UDZO "${{ inputs.artifact_name }}.dmg"
          fi

      - name: Package iOS App Bundle
        if: inputs.build_target == 'ios'
        run: |
          IPA_PATH=$(find . -name "*.ipa" -maxdepth 3 | head -1)
          if [ -n "$IPA_PATH" ]; then
            mv "$IPA_PATH" "${{ inputs.artifact_name }}.ipa"
          fi

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            *.ipa
            *.dmg
          retention-days: 7
