name: Build Switch IPA

on:
  workflow_dispatch:
    inputs:
      method:
        description: 'Download method'
        required: true
        default: 'ddl'
        type: choice
        options:
          - ddl       # Direct HTTP/HTTPS URL
          - gdrive    # Google Drive file ID
      source:
        description: 'Game URL (ddl) or File ID (gdrive)'
        required: true
        type: string
      artifact_name:
        description: 'Output IPA name'
        required: true
        default: 'Switch-Game'
        type: string
      platform:
        description: 'Target platform'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - macos

permissions:
  contents: read

jobs:
  build:
    name: Build App (${{ inputs.platform }})
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      METHOD: ${{ inputs.method }}
      SOURCE: ${{ inputs.source }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      PLATFORM: ${{ inputs.platform }}

    steps:
      - name: Checkout nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          persist-credentials: false

      - name: Install macOS Dependencies
        run: |
          brew install xcodegen zstd glslang p7zip
          brew install --cask dotnet-sdk
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      - name: Prepare Keys
        run: |
          mkdir -p keys_input
          echo "${{ secrets.BASE64_KEYS }}" | base64 -d > keys_input/prod.keys

      - name: Download Game
        run: |
          python3 << 'PYEOF'
          import os, sys, subprocess, urllib.parse, urllib.request, json, base64

          method = os.environ['METHOD']
          source = os.environ['SOURCE']
          os.makedirs('game_input', exist_ok=True)

          def is_archive(url):
              return any(x in url.lower() for x in ['.zip', '.rar', '.7z', 'compressed'])

          def download_direct(url, out_path):
              print(f"Downloading: {out_path}")
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as resp, open(out_path, 'wb') as f:
                  while chunk := resp.read(1024*1024):
                      f.write(chunk)

          def download_gdrive(file_id, out_path):
              api_key = os.environ.get('DRIVE_API_KEY', '').strip()
              if not api_key:
                  sys.exit("DRIVE_API_KEY secret not set")
              domain = base64.b64decode("aHR0cHM6Ly93d3cuZ29vZ2xlYXBpcy5jb20vZHJpdmUvdjMvZmlsZXMv").decode()
              # Get filename from metadata
              meta_url = f"{domain}{file_id}?key={api_key}"
              filename = "game.nsp"
              try:
                  req = urllib.request.Request(meta_url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as resp:
                      meta = json.loads(resp.read().decode())
                  filename = meta.get('name', 'game.nsp').lower()
              except Exception as e:
                  print(f"Metadata fetch failed: {e}")
              # Download actual file
              dl_url = f"{domain}{file_id}?alt=media&key={api_key}"
              download_direct(dl_url, out_path)
              return filename

          archive = is_archive(source)
          tmp = 'game_input/game.tmp' if archive else 'game_input/game.bin'

          if method == 'ddl':
              download_direct(source, tmp)
          elif method == 'gdrive':
              filename = download_gdrive(source, tmp)
              # If we got filename from metadata, we could use it, but we'll just detect from file
          else:
              sys.exit(f"Unknown method: {method}")

          # Extract if archive
          if archive:
              print("Extracting archive...")
              subprocess.run(['7z', 'x', tmp, '-ogame_input/', '-y'], check=True)
              os.remove(tmp)

          # Find .nsp or .xci
          game_file = None
          for root, _, files in os.walk('game_input'):
              for f in files:
                  if f.lower().endswith(('.nsp', '.xci')):
                      game_file = os.path.join(root, f)
                      break
              if game_file:
                  break

          if not game_file:
              sys.exit("No .nsp/.xci found in download")

          ext = 'xci' if '.xci' in game_file.lower() else 'nsp'
          final = f'game_input/game.{ext}'
          os.rename(game_file, final)
          print(f"Game ready: {final}")

          with open('game_input/.ext', 'w') as f:
              f.write(ext)
          PYEOF

      - name: Build IPA / App
        run: |
          set -euo pipefail
          EXT=$(cat game_input/.ext)
          GAME="game_input/game.${EXT}"

          echo "Building ${PLATFORM} from ${GAME}"

          # Disable prebuild download in build script (we already have the game)
          if [ -f scripts/build_ipa_from_nsp.py ]; then
            sed -i.bak 's/^\(.*download_game.*\)$/# \1  # DISABLED/' scripts/build_ipa_from_nsp.py
            sed -i.bak 's/^\(.*fetch_game.*\)$/# \1  # DISABLED/' scripts/build_ipa_from_nsp.py
            sed -i.bak 's/^\(.*pso_prebuild.*\)$/# \1  # DISABLED/' scripts/build_ipa_from_nsp.py
          fi

          if [ "${PLATFORM}" = "ios" ]; then
            python3 scripts/build_ipa_from_nsp.py "${GAME}" -k keys_input/prod.keys --platform ios
          else
            python3 scripts/build_ipa_from_nsp.py "${GAME}" -k keys_input/prod.keys --platform mac-app --gpu none
          fi

      - name: Package Output
        run: |
          set -euo pipefail
          if [ "${PLATFORM}" = "ios" ]; then
            IPA=$(find . -name "*.ipa" -maxdepth 3 | head -1)
            [ -n "$IPA" ] || { echo "No IPA found"; exit 1; }
            mv "$IPA" "${ARTIFACT_NAME}.ipa"
            echo "Created ${ARTIFACT_NAME}.ipa"
          else
            APP=$(find . -name "*.app" -maxdepth 3 | head -1)
            [ -n "$APP" ] || { echo "No .app found"; exit 1; }
            hdiutil create -volname "${ARTIFACT_NAME}" -srcfolder "$APP" -ov -format UDZO "${ARTIFACT_NAME}.dmg"
            echo "Created ${ARTIFACT_NAME}.dmg"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            *.ipa
            *.dmg
          retention-days: 7
          if-no-files-found: error
